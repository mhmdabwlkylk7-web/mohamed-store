<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohamed Store</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial,Tahoma,sans-serif;
}

.container{
  max-width:700px;
  margin:auto;
  padding:25px 15px;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  margin:30px 0 10px;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:35px;
}

button{
  width:100%;
  padding:16px;
  margin:8px 0;
  border:1px solid #444;
  border-radius:12px;
  background:#111;
  color:white;
  font-size:18px;
  cursor:pointer;
}

button:hover{
  background:#222;
}

.card{
  background:#111;
  border:1px solid #292929;
  border-radius:15px;
  padding:18px;
  margin:15px 0;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin:10px 0;
}

.hidden{
  display:none;
}

.back{
  background:white;
  color:black;
}

</style>
</head>

<body>

<div class="container">

<div id="home">

<div class="logo">
Mohamed Store
</div>

<div class="subtitle">
جودة وضمان • تصاميم عصرية • خامة ممتازة • سعر مناسب
</div>

<button onclick="show('Atbara')">
عطبرة
</button>

<button onclick="show('Omdurman')">
أم درمان
</button>

<button onclick="show('PortSudan')">
بورتسودان
</button>

<button onclick="shipping()">
الإرساليات لباقي الولايات
</button>

</div>


<div id="shop" class="hidden">

<button class="back" onclick="back()">
← رجوع
</button>

<h2 id="locationTitle"></h2>

<div class="card">

<h2>لا توجد عروض مضافة حالياً</h2>

<p style="color:#aaa">
العروض والمنتجات حتظهر هنا بعد ربط لوحة الإدارة وقاعدة البيانات.
</p>

</div>

</div>

</div>


<script>

function show(location){

document.getElementById("home").classList.add("hidden");

document.getElementById("shop").classList.remove("hidden");

let names={
"Atbara":"عروض عطبرة",
"Omdurman":"عروض أم درمان",
"PortSudan":"عروض بورتسودان"
};

document.getElementById("locationTitle").innerText=names[location];

}

function back(){

document.getElementById("shop").classList.add("hidden");

document.getElementById("home").classList.remove("hidden");

}

function shipping(){

let message=
"السلام عليكم، عاوز استفسر عن الإرساليات لباقي الولايات.";

window.location.href=
"https://wa.me/249901358927?text="+
encodeURIComponent(message);

}

</script>

</body>
</html>
