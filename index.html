<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mohamed Store</title>
<style>
body{margin:0;background:#050505;color:#fff;font-family:Arial,Tahoma;padding:16px}
.box{max-width:800px;margin:auto}
.card{background:#111;border:1px solid #292929;border-radius:15px;padding:15px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
button,input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border-radius:9px;border:1px solid #444;background:#090909;color:#fff}
button{background:#fff;color:#000;font-weight:bold}
img{width:100%;max-height:280px;object-fit:cover;border-radius:10px}
.hide{display:none}
.topbar{display:flex;gap:8px;position:sticky;top:0;background:#050505;padding:6px 0;z-index:5}
.topbar button{flex:1}
.cartBtn{position:relative}
.cartBtn span{background:#fff;color:#000;border-radius:20px;padding:2px 7px;margin-right:4px}
.muted{color:#999;font-size:13
